[package]
name = "threshold-app"
version = "0.1.0"
edition.workspace = true

[lib]
name = "threshold_app"
path = "src/lib.rs"

[[bin]]
name = "threshold"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
threshold-core = { path = "../crates/threshold-core" }
threshold-ollama = { path = "../crates/threshold-ollama" }
toml = "0.9"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
