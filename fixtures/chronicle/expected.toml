# What a correct Seed Draft and World Build of source.md hold, written by
# hand. The world_build evaluation scores each run against it.
#
# A name matches through normalize::name on the main name and the other
# names. A [[settled]] or [[open]] item is found when a fact on the same
# subject holds every word of `about` in its key, value and text. An open
# item is stated as done (false past) when a settled fact on its subject
# holds every word of one of its `done` phrases: words that only a completed
# event would hold, and that no settled statement of the source holds. An
# item with no such phrase sets not_scored_for_false_past instead.

pc_name = "Teodor Brandt"
pc_age = 34
# Known to Agathe Morrow and Sefa Lind; not to Odile Quast or Gerrit Vane.
pc_other_names = ["Wick"]
start_place = "The Copper Kettle"
start_present = ["Agathe Morrow", "Sefa Lind", "Pim Quast"]

