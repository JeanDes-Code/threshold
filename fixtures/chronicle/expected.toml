# The source states the plan of some open items as settled ("the Guild has
# proposed to buy the ferry", "has saved for the wedding feast", "has a buyer
# for her potter's wheel"). A settled fact on the plan is right, so `done`
# never holds a word of those statements.
[[open]]
subject = "The Bargemen's Guild"
about = "ferry"
done = ["bought ferry", "owns ferry"]

[[open]]
subject = "Osric Fell"
about = "wedding"
done = ["married", "wedding took place", "wedding was held"]

[[open]]
subject = "The Lamplighters"
about = "meeting"
done = ["met", "meeting took place", "meeting was held"]

[[open]]
subject = "Odile Quast"
about = "inquiry"
done = ["questioned", "inquiry ended", "inquiry closed"]

[[open]]
subject = "Henrike Sall"
about = "wheel"
done = ["sold wheel", "bought wheel"]

[[open]]
subject = "Teodor Brandt"
about = "post"
done = ["carried post", "delivered post"]

# Who wrote the sealed letter is not established. No done phrase can tell a
# fact that names the writer from a correct settled fact about the letter:
# "wrote letter" and "letter written by" both fit "a sealed letter written by
# an unknown hand". So this item is not scored for false past; open recall
# still reads it. A fact on it may take the writer as subject; open recall
# then misses it.
[[open]]
subject = "Teodor Brandt"
about = "letter"
not_scored_for_false_past = true
