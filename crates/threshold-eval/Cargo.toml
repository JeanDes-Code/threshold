[package]
name = "threshold-eval"
version = "0.1.0"
edition.workspace = true
publish = false

# Development tool only. The app crate (src-tauri) must never depend on it,
# so no judge reaches play time.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
threshold-core = { path = "../threshold-core" }
threshold-ollama = { path = "../threshold-ollama" }
toml = "0.9"
