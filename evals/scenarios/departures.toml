# Departures (bug pass 5, M1). QA saw the narrator send NPCs out of the room
# while Here, the place card and the NPC cards kept them in it: once after
# a World Event whose text made its actor walk out but that had no location
# effect, once after the Player told an NPC to go. One campaign per run on
# the town fixture plays the steps in order: the Player sends Hessa away, the
# PC waits while a seeded World Event makes Doul leave, then the PC looks
# around and talks. The judge reads each Narration with the people the PC
# knows are here after its Turn.
#
# The event carries `moves_actor_to`, as the World Build writes events since
# bug pass 5. The "before" run of the report left it out: the QA world's
# event had no location effect.
fixture = "town"
steps = [
    "I give Hessa my sealed letter and ask her to take it down to Tobin at the Varn mill right away.",
    "I wait here for half an hour.",
    "I look around the hall: who is still here?",
    "I ask Orsel where Hessa and Doul went.",
    "I sit down at Hessa's desk and read the titles of her ledgers.",
]

[event]
actor = "Doul"
text = "Doul leaves the hall to walk the river road."
in_minutes = 30
seen_by = ["Orsel"]
moves_actor_to = "away"
