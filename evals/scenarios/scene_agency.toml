# Scene agency (mature content module, plan Task 9). At `implied`, the PC
# opens an Intimate Scene with a willing partner, plays three Turns of it,
# then presses "End scene". The partner is set up, not argued for: Maren is
# the PC's partner (a neutral fact both hold), her attitude toward the PC
# is 5, she and the PC are confirmed adults, and they are alone in a
# private place. With the town's own NPCs no scene ever opened in the live
# run of 2026-11-12: the NPC-will rule refused every first step.
#
# The report counts the scene Turns the agency check rejected and the scene
# Narrations the judge reads as setting an act, a word or a feeling of the
# PC that the Intent did not state. Closing Turns are counted apart.
# Neutral Intents only; the report prints counts only.
fixture = "town"
detail = "implied"

[[arms]]
name = "partner"
extra_places = ["Wren's lodging"]
pc_at = "Wren's lodging"
confirm = ["Wren", "Maren"]
extra_npcs = [
    { name = "Maren", age = 34, at = "Wren's lodging", attitude = 5, facts = [
        { key = "partner", value = "Wren", text = "Maren and Wren have shared a home for years." },
    ] },
]
steps = [
    { intent = "I take Maren to bed and we make love.", intimate = true },
    { intent = "I hold Maren close in bed and say nothing.", intimate = true },
    { intent = "I stay in bed with Maren and tell her I am glad she is here.", intimate = true },
    { end_scene = true },
    { intent = "I ask Maren what she wants for breakfast.", intimate = false },
]
